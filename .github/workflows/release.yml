name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# One tag, two shells. Both jobs attach their artifacts to the same draft
# release, so every version is available in either build.
jobs:
  electron:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --mac --arm64 --x64
          - platform: ubuntu-22.04
            args: --linux
          - platform: windows-latest
            args: --win
    runs-on: ${{ matrix.platform }}
    # A Windows signing request sits in SignPath until a maintainer approves
    # it; give the job room to wait (the action's own limit is set below).
    timeout-minutes: 180
    env:
      # Windows binaries are signed through SignPath Foundation (see "Code
      # signing policy" in the README) once the project exists there and the
      # secrets are set. Until then the Windows runner publishes unsigned, as
      # macOS and Linux do here — so a missing secret never blocks a release.
      SIGNPATH: ${{ matrix.platform == 'windows-latest' && secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci

      # The .p8 is a file on disk for both toolchains, and it only exists for
      # the length of the job.
      - name: Write the App Store Connect key
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.APPLE_API_KEY_P8 }}" | base64 --decode > ~/private_keys/AuthKey.p8

      # electron-builder only packages what is already built.
      - run: npm run build:app

      # ── Windows, signed ────────────────────────────────────────────────────
      # Build locally, hand the installer and the portable zip to SignPath,
      # and attach what comes back. Signing happens off the runner — the
      # certificate never touches CI — and only after a maintainer approves
      # the request in SignPath, which is what the long wait is for.
      - name: Build (unsigned, for SignPath)
        if: env.SIGNPATH == 'true'
        run: npx electron-builder --win --publish never

      - name: Upload unsigned Windows artifacts
        if: env.SIGNPATH == 'true'
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: |
            release/OmniAgent-electron-*.exe
            release/OmniAgent-electron-*.zip
          if-no-files-found: error

      - name: Sign with SignPath
        if: env.SIGNPATH == 'true'
        id: signpath
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: omniagent
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # Two hours for a human to approve; the job-level timeout is longer.
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed

      - name: Attach signed Windows artifacts to the release
        if: env.SIGNPATH == 'true'
        shell: bash
        run: |
          # Whichever job reaches the release first creates the draft; the
          # `notes` job titles it once everything has uploaded.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "$TAG" --notes ""
          gh release upload "$TAG" signed/* --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}

      # ── Everything else: electron-builder publishes straight to the draft ──
      - name: Build and publish
        if: env.SIGNPATH != 'true'
        run: npx electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS artifacts are signed with the Developer ID certificate and
          # notarized (build/notarize.cjs). Unset on the other runners, where
          # both steps are skipped.
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # build/notarize.cjs reads these three.
          APPLE_API_KEY_PATH: ~/private_keys/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

  notes:
    needs: [electron, tauri]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Whichever build reaches the release first creates the draft, and
      # electron-builder names it after the bare version with an empty body.
      - name: Title the release
        run: |
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "OmniAgent $TAG" --notes-file .github/release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}

  tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            args: --target aarch64-apple-darwin
          - platform: macos-latest # Intel
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          # Windows reaches its tmux through WSL — see "the local machine is
          # WSL" in the README. The runner has no distro, so this job only
          # proves the build; the pods are exercised on a real machine.
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      # The .p8 is a file on disk for both toolchains, and it only exists for
      # the length of the job.
      - name: Write the App Store Connect key
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.APPLE_API_KEY_P8 }}" | base64 --decode > ~/private_keys/AuthKey.p8

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Tauri reads APPLE_API_KEY as the key *id*, not a path — the same
          # name electron-builder uses for the file. Hence the explicit names.
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ~/private_keys/AuthKey.p8
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "OmniAgent ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
